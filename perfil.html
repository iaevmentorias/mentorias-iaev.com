<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Perfil / Ver más detalles - IAEV</title>
    <link rel="stylesheet" href="css/estilo_base.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>

<div class="layout-container">
    <aside class="sidebar">
        <div>
            <div class="logo-container">
                <img src="imagenes/principal.png" alt="IAEV Logo">
            </div>
            <ul class="sidebar-menu">
                <li><a href="principal.html">Panel de control</a></li>
                <li class="active"><a href="estudiantes.html">Estudiantes</a></li>
                <li><a href="sesiones.html">Sesiones</a></li>
                <li><a href="riesgo.html">Riesgo academico</a></li>
                <li><a href="carga.html">Cargar datos</a></li>
                <li><a href="configuracion.html">Configuración</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <a href="#">Términos y condiciones</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="search-box">
                <input type="text" placeholder="Buscar estudiante por nombre o matricula...">
            </div>
            <a href="perfil.html" class="user-profile">
                <div class="avatar-circle">OL</div>
                <div class="user-info">
                    <span>Olga Luevano</span>
                    <span class="role">Coordinadora</span>
                </div>
            </a>
        </header>

        <main class="content-area">
            <div class="profile-wrapper">
                <div class="profile-avatar">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.5">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="10" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>

                <div class="profile-info">
                    <p><strong>Nombre del Alumno:</strong> ----------</p>
                    <p><strong>Estatus:</strong> ----------</p>
                    <p><strong>Carrera:</strong> ----------</p>
                    <p><strong>Grado y sección:</strong> ----------</p>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
