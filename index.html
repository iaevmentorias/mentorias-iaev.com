<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido a su Portal</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div class="card-container">
    <h1>Bienvenido a su Portal</h1>
    
    <div class="content">
      <!-- Columna izquierda: Ilustraciones / Logo -->
      <div class="left-section">
        <img src="./imagenes/portal.png" alt="Ilustración IAEV">
      </div>

      <!-- Columna derecha: Formulario de Login -->
      <div class="right-section">
        <form>
          <div class="form-group">
            <label for="email">Usuario (Correo electrónico)</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              value="olgaluev1098@gmail.com" 
              placeholder="olgaluev1098@gmail.com"
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              value="************" 
              placeholder="************"
            >
          </div>

          <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
