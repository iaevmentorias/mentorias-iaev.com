<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido a su Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenedor principal con bordes redondeados y marco azul simular al diseño */
    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 40px;
      border-radius: 40px;
      border: 3px solid #3b82f6;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 500;
      color: #111;
      margin-bottom: 30px;
      margin-left: 10px;
    }

    /* Estructura en dos columnas */
    .content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .left-section img {
      max-width: 100%;
      height: auto;
    }

    .right-section {
      flex: 1;
      max-width: 380px;
    }

    /* Formulario */
    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #000;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #2b2b2b;
      border: 2px solid #f2b705;
      border-radius: 10px;
      color: #888888;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input::placeholder {
      color: #777777;
    }

    /* Botón */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #f5b813;
      border: none;
      border-radius: 10px;
      color: #000000;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #e0a70e;
    }

    /* Responsive para pantallas pequeñas */
    @media (max-width: 768px) {
      .content {
        flex-direction: column;
      }
      .right-section {
        width: 100%;
      }
      .card-container {
        border-radius: 20px;
        padding: 20px;
        margin: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h1>Bienvenido a su Portal</h1>
    
    <div class="content">
      <!-- Columna izquierda: Ilustraciones / Logo -->
      <div class="left-section">
        <!-- Reemplaza "tu-imagen-o-logo.png" por la ruta de tu imagen combinada o logotipo -->
        <img src="./imagenes/portal.png" alt="Ilustración IAEV">
      </div>

      <!-- Columna derecha: Formulario de Login -->
      <div class="right-section">
        <form>
          <div class="form-group">
            <label for="email">Usuario (Correo electronico)</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              value="olgaluev1098@gmail.com" 
              placeholder="olgaluev1098@gmail.com"
            >
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              value="************" 
              placeholder="************"
            >
          </div>

          <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
